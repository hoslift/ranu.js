packages:
  - "packages/*"
  - "ai"
  - "ai/*"
  - "adapters"
  - "adapters/*"
  - "plugins/*"
  - "integrations"
  - "integrations/*"
  - "ui"
  - "ui/*"
  - "tools"
  - "tools/*"
  - "create-ranu"
  - "examples/*"
  - "fixtures/*"
  - "tooling/*"
  - "templates"
  - "templates/*"
  - "test-app"
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.8'
  - '@turbo/darwin-arm64@2.11.8'
  - '@turbo/linux-64@2.11.8'
  - '@turbo/linux-arm64@2.11.8'
  - '@turbo/windows-64@2.11.8'
  - '@turbo/windows-arm64@2.11.8'
  - turbo@2.11.8
overrides:
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
  "brace-expansion@>=4.0.0": "5.0.12"
  esbuild: ">=0.28.2"
  "source-map-js": ">=1.2.2"
  "js-yaml@^4": "4.3.2"
  "vite": "7.3.7"
  "vitest": "4.1.12"
  "@vitest/coverage-v8": "4.1.12"
  "@vitest/mocker": "4.1.12"
  "minimatch@>=10 <11": "11.0.5"
  "tinypool": ">=2.1.2"
  "react": "^19.3.0"
  "react-dom": "^19.3.0"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
