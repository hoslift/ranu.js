name: Changeset Check

on:
  pull_request:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'adapters/**'
      - 'ai/**'
      - 'create-ranu/**'
      - 'templates/**'
      - 'plugins/**'
      - 'integrations/**'
      - 'ui/**'
      - 'tools/**'

permissions:
  contents: read

jobs:
  changeset-check:
    name: Verify Changeset
    if: "!startsWith(github.head_ref, 'changeset-release/')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Changeset Presence
        run: |
          echo "Checking whether a changeset is included for package modifications..."
          pnpm changeset status --since=origin/main
