name: Release & Dual-Registry Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry-run release check (no publish)"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release & Dual-Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '11.7.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Authenticate registries in ~/.npmrc
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Run Dry-Run Release Simulation
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: pnpm run release:dual --dry-run
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Automated Changesets State Machine:
      # - When changesets exist on main: Opens/updates "chore(release): version packages" PR. Does NOT publish.
      # - When the release PR is merged into main: Runs `publish: pnpm run release:dual`,
      #   creates Git release tags, publishes releases, and distributes to npmjs.com and GitHub Packages!
      - name: Create Release Pull Request or Dual-Publish
        id: changeset
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm run release:dual
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
